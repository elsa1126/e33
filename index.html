<style>
/* 2140 風格：純黑底、深灰卡片、白灰兩階文字、置中窄欄；刻意只做深色 */
:root {
  color-scheme: dark;
  --bg: #000; --card: rgb(32,32,32); --float: rgb(50,50,50); --hi: rgb(64,64,64);
  --text: rgb(245,245,245); --gray: rgb(141,141,147); --dim: rgb(96,96,98); --line: rgba(255,255,255,.06);
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); font-family: "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif; font-weight: 600; }
body { padding-bottom: calc(110px + env(safe-area-inset-bottom, 0px)); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { max-width: 552px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding: 16px 0 10px; }
.top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.logo { font-size: 20px; font-weight: 700; letter-spacing: .5px; }
#status { color: var(--dim); font-size: 13px; text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#tabs { display: flex; gap: 8px; overflow-x: auto; padding: 12px 0 2px; scrollbar-width: none; }
#tabs::-webkit-scrollbar { display: none; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
.chip { flex: none; border: 0; background: var(--card); color: var(--gray); font: inherit; font-size: 14px; padding: 8px 14px; border-radius: 9999px; cursor: pointer; }
.chip.on { background: var(--text); color: #000; }
.sec { margin-top: 22px; }
.sechead { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 10px; }
h1 { font-size: 28px; margin: 0 0 12px; }
h2 { font-size: 22px; margin: 0; }
.gray { color: var(--gray); font-size: 14px; }
.small { font-size: 12px; color: var(--dim); }
.pad { padding: 10px 2px; line-height: 1.6; }
.gray.pad { font-weight: 400; }
.card .pad { padding: 14px 16px; }
.card { background: var(--card); border-radius: 12px; box-shadow: rgba(0,0,0,.15) 0 2px 8px; margin-bottom: 10px; overflow: hidden; }
.row { display: flex; align-items: center; gap: 12px; padding: 12px 16px; min-height: 56px; }
.row + .row { border-top: 1px solid var(--line); }
.rm { flex: 1; min-width: 0; }
.rt { font-size: 16px; overflow-wrap: anywhere; }
.rs { font-size: 12px; color: var(--dim); margin-top: 3px; overflow-wrap: anywhere; line-height: 1.5; }
.rr { display: flex; align-items: center; gap: 8px; flex: none; }
.empty { padding: 20px 16px; color: var(--gray); }
.tools { position: sticky; top: calc(98px + env(safe-area-inset-top, 0px)); z-index: 4; background: var(--bg); padding: 4px 0 10px; }
.search { width: 100%; background: var(--card); color: var(--text); border: 0; border-radius: 12px; padding: 12px 14px; font: inherit; font-size: 15px; outline: none; }
.search::placeholder { color: var(--dim); }
.chips { display: flex; gap: 8px; overflow-x: auto; margin-top: 8px; scrollbar-width: none; }
.charpick { margin-top: 20px; }
.bulk { display: flex; gap: 8px; flex-wrap: wrap; margin: 0 0 10px; }
.pill { border: 0; background: var(--float); color: var(--text); font: inherit; font-size: 14px; padding: 9px 16px; border-radius: 60px; cursor: pointer; }
.pill.ghost { background: transparent; color: var(--gray); box-shadow: inset 0 0 0 1px var(--hi); }
.pill.big { font-size: 16px; padding: 14px 28px; background: var(--text); color: #000; }
.pill:disabled { opacity: .35; cursor: default; }
.num { width: 92px; background: var(--hi); color: var(--text); border: 0; border-radius: 9px; padding: 7px 9px; font: inherit; font-size: 15px; text-align: right; }
select.wear { width: 130px; max-width: none; text-overflow: ellipsis; }
select { max-width: 150px; background: var(--hi); color: var(--text); border: 0; border-radius: 9px; padding: 7px 8px; font: inherit; font-size: 13px; }
.tg { width: 46px; height: 28px; border: 0; border-radius: 9999px; background: var(--hi); position: relative; cursor: pointer; padding: 0; flex: none; }
.tg span { position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--gray); transition: left .15s; }
.tg.on { background: var(--text); }
.tg.on span { left: 21px; background: #000; }
.hero { padding: 60px 4px 20px; }
.notes { margin: 10px 0 0; padding-left: 18px; color: var(--gray); font-size: 14px; font-weight: 400; line-height: 1.8; }
.act { padding: 0 16px 16px; }
.act .pill { width: 100%; }
.sample { margin-top: 18px; }
.sample .bulk.pad { padding-top: 0; }
.hero p { line-height: 1.7; }
.bar { position: fixed; left: 0; right: 0; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); display: flex; justify-content: center; gap: 10px; z-index: 6; pointer-events: none; }
.bar button { pointer-events: auto; border: 0; background: var(--float); color: var(--text); font: inherit; cursor: pointer; box-shadow: rgba(0,0,0,.5) 0 4px 16px; }
.round { width: 52px; height: 52px; border-radius: 9999px; display: grid; place-items: center; }
.round svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
#dl { height: 52px; padding: 0 26px; border-radius: 60px; font-size: 16px; }
#dl:disabled { opacity: .35; cursor: default; }
#toast { position: fixed; left: 50%; bottom: calc(86px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%) translateY(10px); background: var(--text); color: #000; padding: 10px 16px; border-radius: 12px; font-size: 14px; opacity: 0; transition: .2s; pointer-events: none; z-index: 7; max-width: calc(100% - 32px); }
#toast.on { opacity: 1; transform: translateX(-50%); }
/* 電腦版（1024px 以上）：左側欄放分頁與檔案按鈕，右邊內容加寬，長清單排兩欄；手機版不受影響 */
@media (min-width: 1024px) {
  body { padding-bottom: 40px; }
  .wrap { max-width: 1240px; display: grid; grid-template-columns: 240px minmax(0, 1fr); column-gap: 48px; padding: 0 32px; align-items: start; }
  header { position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; padding: 28px 0 104px; }
  .top { flex-direction: column; align-items: flex-start; gap: 6px; }
  .logo { font-size: 22px; }
  #status { text-align: left; white-space: normal; }
  #tabs { flex-direction: column; overflow-x: visible; overflow-y: auto; gap: 2px; padding: 16px 0 0; min-height: 0; }
  #tabs .chip { text-align: left; background: transparent; padding: 7px 16px; font-size: 15px; }
  #tabs .chip:hover { background: var(--card); color: var(--text); }
  #tabs .chip.on { background: var(--text); color: #000; }
  main { padding: 28px 0 0; min-width: 0; }
  .sec:first-child, .sample { margin-top: 0; }
  .tools { top: 0; padding-top: 8px; }
  .bar { left: max(32px, calc(50% - 620px + 32px)); right: auto; width: 240px; bottom: 28px; justify-content: flex-start; }
  #dl { flex: 1; padding: 0 16px; }
  /* 十列以上的清單排成兩欄 */
  .card:has(> .row:nth-child(10)) { display: grid; grid-template-columns: 1fr 1fr; }
  .card:has(> .row:nth-child(10)) > .row + .row { border-top: 0; }
  .card:has(> .row:nth-child(10)) > .row:nth-child(n+3) { border-top: 1px solid var(--line); }
  .card:has(> .row:nth-child(10)) > .row:nth-child(even) { border-left: 1px solid var(--line); }
  .card:has(> .row:nth-child(10)) > .empty { grid-column: 1 / -1; }
}
@media (max-width: 420px) { .num { width: 72px; } select { max-width: 110px; } select.wear { width: 108px; max-width: none; } .tools { top: calc(94px + env(safe-area-inset-top, 0px)); } }
</style>

<script>// E33 GVAS 存檔解析與寫回（UE 5.4 complete type name 欄位格式）
// 設計：每個屬性解析後立刻重新序列化比對；比對不一致就保留原始位元組，確保寫回時不會弄壞看不懂的部分。
(function (root) {
  const td = new TextDecoder('latin1');

  class Reader {
    constructor(u8, o = 0) { this.b = u8; this.v = new DataView(u8.buffer, u8.byteOffset, u8.byteLength); this.o = o; }
    i32() { const x = this.v.getInt32(this.o, true); this.o += 4; return x; }
    u32() { const x = this.v.getUint32(this.o, true); this.o += 4; return x; }
    i64() { const x = this.v.getBigInt64(this.o, true); this.o += 8; return x; }
    u8() { return this.b[this.o++]; }
    bytes(n) { if (n < 0 || this.o + n > this.b.length) throw new Error('out of range'); const x = this.b.slice(this.o, this.o + n); this.o += n; return x; }
    fstr() {
      const n = this.i32();
      if (n === 0) return { s: '', z: true };
      if (n < 0) {
        const len = -n * 2; if (len > 1e6) throw new Error('bad wstring');
        const raw = this.bytes(len); let s = '';
        for (let i = 0; i < len - 2; i += 2) s += String.fromCharCode(raw[i] | (raw[i + 1] << 8));
        return { s, w: true };
      }
      if (n > 1e6) throw new Error('bad string len ' + n);
      const raw = this.bytes(n); return { s: td.decode(raw.subarray(0, n - 1)) };
    }
    str() { return this.fstr().s; }
  }

  class Writer {
    constructor() { this.chunks = []; this.len = 0; }
    push(u8) { this.chunks.push(u8); this.len += u8.length; }
    i32(x) { const a = new Uint8Array(4); new DataView(a.buffer).setInt32(0, x, true); this.push(a); }
    u32(x) { const a = new Uint8Array(4); new DataView(a.buffer).setUint32(0, x, true); this.push(a); }
    i64(x) { const a = new Uint8Array(8); new DataView(a.buffer).setBigInt64(0, BigInt(x), true); this.push(a); }
    u8(x) { this.push(Uint8Array.of(x)); }
    fstr(f) {
      if (typeof f === 'string') f = { s: f };
      if (f.z || (f.s === '' && !f.w)) { this.i32(0); return; }
      const wide = f.w || /[^\x00-\xff]/.test(f.s);
      if (wide) {
        const a = new Uint8Array((f.s.length + 1) * 2);
        for (let i = 0; i < f.s.length; i++) { const c = f.s.charCodeAt(i); a[i * 2] = c & 255; a[i * 2 + 1] = c >> 8; }
        this.i32(-(f.s.length + 1)); this.push(a);
      } else {
        const a = new Uint8Array(f.s.length + 1);
        for (let i = 0; i < f.s.length; i++) a[i] = f.s.charCodeAt(i);
        this.i32(a.length); this.push(a);
      }
    }
    out() { const r = new Uint8Array(this.len); let o = 0; for (const c of this.chunks) { r.set(c, o); o += c.length; } return r; }
  }

  // 型別樹 {n, k:[...]}
  function readType(r) { const n = r.str(); const c = r.i32(); const k = []; for (let i = 0; i < c; i++) k.push(readType(r)); return { n, k }; }
  function writeType(w, t) { w.fstr(t.n); w.i32(t.k.length); for (const c of t.k) writeType(w, c); }

  // 固定長度、不帶欄位標記的原生 struct
  const NATIVE = { Guid: 16, Vector: 24, Rotator: 24, Quat: 32, DateTime: 8, Timespan: 8, LinearColor: 16, Color: 4, Vector2D: 16, IntPoint: 8, IntVector: 12, Vector4: 32, Box: 49, Box2D: 33 };
  const structName = (t) => (t.k[0] ? t.k[0].n : '');

  function readVal(r, t, inner) {
    switch (t.n) {
      case 'IntProperty': return r.i32();
      case 'UInt32Property': return r.u32();
      case 'Int64Property': case 'UInt64Property': return r.i64();
      case 'Int16Property': { const x = r.v.getInt16(r.o, true); r.o += 2; return x; }
      case 'UInt16Property': { const x = r.v.getUint16(r.o, true); r.o += 2; return x; }
      case 'Int8Property': { const x = r.v.getInt8(r.o); r.o += 1; return x; }
      case 'FloatProperty': { const x = r.v.getFloat32(r.o, true); r.o += 4; return x; }
      case 'DoubleProperty': { const x = r.v.getFloat64(r.o, true); r.o += 8; return x; }
      case 'BoolProperty': return !!r.u8();
      case 'NameProperty': case 'StrProperty': case 'ObjectProperty': case 'EnumProperty': return r.fstr();
      case 'ByteProperty': return (t.k[0] && t.k[0].n !== 'None') ? r.fstr() : r.u8();
      case 'SoftObjectProperty': return { pkg: r.fstr(), asset: r.fstr(), sub: r.fstr() };
      case 'StructProperty': {
        const sn = structName(t);
        if (NATIVE[sn]) return { native: r.bytes(NATIVE[sn]) };
        if (sn === 'GameplayTagContainer') { const c = r.i32(); const a = []; for (let i = 0; i < c; i++) a.push(r.fstr()); return { tags: a }; }
        return { props: readProps(r) };
      }
      case 'ArrayProperty': case 'SetProperty': {
        const rm = t.n === 'SetProperty' ? r.i32() : null; if (rm) throw new Error('set removals');
        const c = r.i32(); if (c < 0 || c > 1e6) throw new Error('bad count');
        const a = []; for (let i = 0; i < c; i++) a.push(readVal(r, t.k[0], true));
        return a;
      }
      case 'MapProperty': {
        const rm = r.i32(); if (rm) throw new Error('map removals');
        const c = r.i32(); if (c < 0 || c > 1e6) throw new Error('bad count');
        const a = []; for (let i = 0; i < c; i++) { const k = readVal(r, t.k[0], true); const v = readVal(r, t.k[1], true); a.push([k, v]); }
        return a;
      }
    }
    throw new Error('unsupported ' + t.n);
  }

  function writeVal(w, t, v) {
    switch (t.n) {
      case 'IntProperty': w.i32(v); return;
      case 'UInt32Property': w.u32(v); return;
      case 'Int64Property': case 'UInt64Property': w.i64(v); return;
      case 'Int16Property': { const a = new Uint8Array(2); new DataView(a.buffer).setInt16(0, v, true); w.push(a); return; }
      case 'UInt16Property': { const a = new Uint8Array(2); new DataView(a.buffer).setUint16(0, v, true); w.push(a); return; }
      case 'Int8Property': w.u8(v & 255); return;
      case 'FloatProperty': { const a = new Uint8Array(4); new DataView(a.buffer).setFloat32(0, v, true); w.push(a); return; }
      case 'DoubleProperty': { const a = new Uint8Array(8); new DataView(a.buffer).setFloat64(0, v, true); w.push(a); return; }
      case 'BoolProperty': w.u8(v ? 1 : 0); return;
      case 'NameProperty': case 'StrProperty': case 'ObjectProperty': case 'EnumProperty': w.fstr(v); return;
      case 'ByteProperty': if (t.k[0] && t.k[0].n !== 'None') w.fstr(v); else w.u8(v); return;
      case 'SoftObjectProperty': w.fstr(v.pkg); w.fstr(v.asset); w.fstr(v.sub); return;
      case 'StructProperty':
        if (v.native) { w.push(v.native); return; }
        if (v.tags) { w.i32(v.tags.length); for (const x of v.tags) w.fstr(x); return; }
        writeProps(w, v.props); return;
      case 'ArrayProperty': case 'SetProperty':
        if (t.n === 'SetProperty') w.i32(0);
        w.i32(v.length); for (const x of v) writeVal(w, t.k[0], x); return;
      case 'MapProperty':
        w.i32(0); w.i32(v.length); for (const [k, x] of v) { writeVal(w, t.k[0], k); writeVal(w, t.k[1], x); } return;
    }
    throw new Error('unsupported ' + t.n);
  }

  // 屬性：{name, type, flags, idx, guid, value} 或 {..., raw}
  function readProps(r) {
    const props = [];
    for (;;) {
      const name = r.fstr();
      if (name.s === 'None') { props.end = name; return props; }
      const type = readType(r); const size = r.i32(); const flags = r.u8();
      const p = { name, type, flags };
      if (flags & 1) p.idx = r.i32();
      if (flags & 2) p.guid = r.bytes(16);
      if (flags & 4) throw new Error('property extensions');
      if (type.n === 'BoolProperty') { p.value = !!(flags & 0x10); if (size) p.raw = r.bytes(size); props.push(p); continue; }
      const start = r.o; const raw = r.bytes(size);
      try {
        const sub = new Reader(raw);
        const v = readVal(sub, type, false);
        if (sub.o !== size) throw new Error('size');
        const w = new Writer(); writeVal(w, type, v); const re = w.out();
        if (re.length !== raw.length || re.some((x, i) => x !== raw[i])) throw new Error('roundtrip');
        p.value = v;
      } catch (e) { p.raw = raw; p.err = e.message; }
      r.o = start + size;
      props.push(p);
    }
  }

  function writeProps(w, props) {
    for (const p of props) {
      w.fstr(p.name); writeType(w, p.type);
      let body;
      if (p.type.n === 'BoolProperty') {
        body = p.raw || new Uint8Array(0);
        p.flags = (p.flags & ~0x10) | (p.value ? 0x10 : 0);
      } else if (p.raw && p.value === undefined) body = p.raw;
      else { const b = new Writer(); writeVal(b, p.type, p.value); body = b.out(); }
      w.i32(body.length); w.u8(p.flags);
      if (p.flags & 1) w.i32(p.idx);
      if (p.flags & 2) w.push(p.guid);
      w.push(body);
    }
    w.fstr(props.end || 'None');
  }

  function parse(u8) {
    const r = new Reader(u8);
    if (td.decode(u8.subarray(0, 4)) !== 'GVAS') throw new Error('不是 GVAS 存檔');
    r.o = 4; const sv = r.i32(); r.i32(); if (sv >= 3) r.i32();
    r.o += 6; const clAt = r.o; const cl = r.u32();
    r.fstr(); r.i32(); const n = r.i32(); r.o += 20 * n;
    const clsAt = r.o; const cls = r.str();
    if (sv >= 3 && u8[r.o] === 0) r.o += 1;
    const header = u8.slice(0, r.o);
    const props = readProps(r);
    const tail = u8.slice(r.o);
    return { header, props, tail, cl: cl & 0x7fffffff, clFlag: cl & 0x80000000, clAt, cls, clsAt };
  }

  function serialize(save) {
    const w = new Writer(); w.push(save.header); writeProps(w, save.props); w.push(save.tail); return w.out();
  }

  // 改檔頭：版本號與存檔類別（V8 <-> V2，長度不變）
  function setHeader(save, cl, clsFrom, clsTo) {
    const h = save.header.slice(); const dv = new DataView(h.buffer);
    dv.setUint32(save.clAt, (save.clFlag | cl) >>> 0, true);
    const r = new Reader(h, save.clsAt); const n = r.i32();
    const s = td.decode(h.subarray(save.clsAt + 4, save.clsAt + 4 + n - 1));
    const ns = s.split(clsFrom).join(clsTo);
    if (ns.length !== s.length) throw new Error('類別名稱長度不同');
    for (let i = 0; i < ns.length; i++) h[save.clsAt + 4 + i] = ns.charCodeAt(i);
    save.header = h; save.cl = cl; save.cls = ns;
  }

  // 工具：在屬性陣列中依名稱前綴找
  const S = (f) => (f && typeof f === 'object' ? f.s : f);
  function find(props, prefix) { return props.find((p) => S(p.name).split('_')[0] === prefix || S(p.name) === prefix); }

  root.GVAS = { parse, serialize, setHeader, find, S, Reader, Writer, readType };

  const CHARS = ['Gustave', 'Lune', 'Maelle', 'Sciel', 'Monoco', 'Verso'];
  // 角色官方繁中名稱（ST_Characters_Name）
  const CN = { Gustave: '古斯塔夫', Lune: '露涅', Maelle: '瑪艾兒', Sciel: '熙爾', Monoco: '莫諾柯', Verso: '維索', Alicia: '艾莉西亞', Sophie: '蘇菲', AliciaEpilogue: '艾莉西亞', Esquie: '艾斯奎', Noco: '諾柯', Emma: '艾瑪' };
  const cn = (x) => CN[x] || x;
  const ATTR = { 0: '活力', 1: '力量', 2: '智力', 3: '敏捷', 4: '防禦', 5: '幸運' };
  const WORLD_CAP = { 0: '騎乘艾斯奎', 1: '撞碎岩石', 2: '游泳', 3: '穿越珊瑚', 4: '飛行' };
  const QSTATUS = { 0: '0 未開始', 1: '1 進行中', 2: '2 完成' };
  const NEVRONS = [
    ['Nevron_JarNeedLight', 'KilledJar', '罈罐人'], ['Nevron_DemineurMissingMine', 'KillDemineur', '水雷靈'],
    ['Nevron_SmallBourgeon', 'KillCompletedBourgeon', '芽簇'], ['Nevron_PortierDoorMaze', 'KillCompletedPortier', '門衛'],
    ['Nevron_WeaponlessChalier', 'KillChalier', '武鬥兵'], ['Nevron_Benisseur', 'KillCompletedBenisseur', '祈福師'],
    ['Nevron_Hexga', 'KillCompletedHexga', '六稜'], ['Nevron_Troubadour', 'KillCompletedTroubadour', '吹號人'],
    ['Nevron_DanseuseDanceClass', 'KillDanseuseDanceTeacher', '舞者導師'], ['Nevron_JudgeOfMercy', 'KillJudgeOfMercy', '純白'],
  ];
  // 好感的角色編號：先從多份存檔比對推出，2026-11-08 再用別人寫的 COE33 Save Editor 交叉確認
  // （每格填不同數字，看落在哪個名稱下）；#6 在兩邊都沒有名稱
  const REL = { 0: CN.Gustave, 1: CN.Lune, 2: CN.Maelle, 3: CN.Verso, 4: CN.Monoco, 5: CN.Sciel, 7: CN.Esquie, 8: CN.Sophie, 9: CN.Alicia };

  // ---------- 中文名稱查詢 ----------
  // ze／zl 來自遊戲官方繁中（敵人、地區），zm 是任務的人工翻譯；鍵名一律去底線轉小寫
  const ZE = DATA.ze || {}, ZL = DATA.zl || {}, ZM = DATA.zm || { quests: {}, objectives: {} };
  const key = (s) => s.replace(/_/g, '').toLowerCase();
  const E_ALIAS = { dancer: 'danseuse', duelliste: 'duallistelr', dualliste: 'duallistelr', licornapied: 'licornapieds', machinapied: 'machinapieds', chalier: 'chaliersword', chalierdagger: 'chaliersword', chalierlancelier: 'chalierspear', potatobag1tank: 'potatobagtank', dpspotatobag: 'potatobagranger', chevaliere: 'chevalierea', gault: 'gaulta', uniqueluster: 'luster', eveque: 'bosseveque', duallist: 'duallistelr', ultimatesakapate: 'potatobagboss', sirene: 'axonsirene', paintress: 'bosspaintress', sprong: 'bosssprong', scavenger: 'bossscavenger', bosspotatobag: 'potatobagboss', blacksmith: 'curatorjumptutorial' };
  const E_EXTRA = { enemygroup: '敵群', monocoduel: '莫諾柯（對決）', none: '無' };
  function enemyZh(a) {
    let s = a.replace(/^jRPG_/, '').replace(/^Enemy_?World_/, '').replace(/^[A-Z]{1,2}_/, '');
    if (ZE[key(s)]) return ZE[key(s)];
    const alpha = /alpha/i.test(s); let prev;
    do { prev = s; s = s.replace(/_?(alpha|renoirdraft|monolith|unique|big|noattack|hexgaquest|final|melee|notutorial|alternative|crushingwall|blue|yellow|orange|violet|red|green|sirene)$/i, '').replace(/_[A-Z]{2,3}$/, ''); } while (s !== prev);
    const k = E_ALIAS[key(s)] || key(s); const n = ZE[k] || E_EXTRA[k];
    return n ? (alpha && !E_EXTRA[k] ? '源色' + n : n) : null;
  }
  const L_ALIAS = { oraneforest: 'orangeforest', cleaflyinghouse: 'cleasflyinghouse', frozenheart: 'frozenhearts', goblu: 'gobluslair', springmeadow: 'springmeadows', esquienest: 'esquiesnest', abbestalpha: 'caveabbest', monolithexteriorpeak: 'monolithpeak', monolithfloor1: 'monolithinterior', monolithinteriorclimb: 'monolithinterior' };
  function levelZh(c) { const s = key(c.replace(/^(Main|Side|Cave|SmallLevel|MiniLevel)_/, '').replace(/_(WP|Main.*|V\d.*)$/, '')); return ZL[L_ALIAS[s] || s] || null; }
  const ATTR_EN = { Vitality: '活力', Might: '力量', Defense: '防禦', Agility: '敏捷', Luck: '幸運', Intelligence: '智力' };
  const nameOf = (x) => CN[x] || ATTR_EN[x] || enemyZh(x) || ZM.objectives[x] || levelZh(x);
  function questZh(q) {
    let m;
    if (ZM.quests[q]) return ZM.quests[q];
    if ((m = q.match(/^Relationship_(\w+)$/)) && CN[m[1]]) return `好感：${CN[m[1]]}`;
    const nv = NEVRONS.find((n) => n[0] === q); if (nv) return `友善經元怪：${nv[2]}`;
    if (q.startsWith('Merchant_') && ZE[key(q.slice(9))]) return `商人：${ZE[key(q.slice(9))]}`;
    if (ZM.quests[q.normalize('NFD').replace(/[\u0300-\u036f]/g, '')]) return ZM.quests[q.normalize('NFD').replace(/[\u0300-\u036f]/g, '')];
    return null;
  }
  function objZh(o) {
    const O = ZM.objectives; let m;
    if (O[o]) return O[o];
    if ((m = o.match(/^\d+_(.+)$/))) {
      const f = m[1].match(/^ForcedCamp_Post(.+)$/);
      if (f) { const n = O[f[1]] || levelZh(f[1]); if (n) return `${n}之後的營地`; }
      return objZh(m[1]);
    }
    if ((m = o.match(/^Relationship_Lvl(\d+)$/))) return `好感等級 ${m[1]}`;
    if ((m = o.match(/^(.+?)_?(\d+)$/)) && O[m[1]]) return `${O[m[1]]} ${+m[2]}`;
    if ((m = o.match(/^DefeatRound(\d+)$/))) return `擊敗第 ${m[1]} 回合`;
    if ((m = o.match(/^CompletedFloor(\d+)$/))) return `完成第 ${m[1]} 層`;
    if ((m = o.match(/^(\w+?)Chosen$/)) && CN[m[1]]) return `選擇${CN[m[1]]}`;
    if ((m = o.match(/^RideWith(\w+)$/)) && CN[m[1]]) return `與${CN[m[1]]}兜風`;
    if ((m = o.match(/^EloquenceBattle_(\w+)$/)) && CN[m[1]]) return `口才對決：${CN[m[1]]}`;
    if ((m = o.match(/^OpenSkillDoor_(\w+)$/)) && ATTR_EN[m[1]]) return `打開屬性之門：${ATTR_EN[m[1]]}`;
    if ((m = o.match(/^DefeatMime_(\w+)$/)) && CN[m[1]]) return `擊敗默偶（${CN[m[1]]}）`;
    if ((m = o.match(/^ReadApprenticesJournal_(\w+)$/))) { const n = O[m[1]] || levelZh(m[1]); if (n) return `閱讀學徒日誌：${n}`; }
    if ((m = o.match(/^(Defeat|Kill(?:Completed)?|Killed)(\w+)$/))) { const n = nameOf(m[2]); if (n) return `${m[1] === 'Defeat' ? '擊敗' : '殺死'}${n}`; }
    return null;
  }
  // 存檔欄位全名（含 GUID 後綴），新增元素時用
  const F_WP_ID = 'DefinitionID_3_60EB24664894755B19F4EBA18A21AF1A', F_WP_LV = 'CurrentLevel_6_227A00644D035BDD595B2D86C8455B71';
  const F_PE_N = 'PassiveEffectName_3_A92DB6CC4549450728A867A714ADF6C5', F_PE_L = 'IsLearnt_9_2561000E49D90653437DE9A45BE2A86D', F_PE_S = 'LearntSteps_6_A14D681549E830249C77BD95F2B4CF3F';
  const T = (n, k = []) => ({ n, k });

  let save = null, fileName = '', dirty = false, tab = 'outfits', origBytes = null, isSample = false;
  const $ = (s, el = document) => el.querySelector(s);
  const h = (tag, attrs = {}, ...kids) => {
    const e = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (k === 'class') e.className = v; else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
      else if (v === true) e.setAttribute(k, ''); else if (v !== false && v != null) e.setAttribute(k, v);
    }
    for (const c of kids.flat()) if (c != null && c !== false) e.append(c.nodeType ? c : document.createTextNode(c));
    return e;
  };

  // ---------- 存檔資料存取 ----------
  // 欄位名稱後面接 _數字_GUID；比對時只看前綴
  const is = (p, name) => { const s = S(p.name); return s === name || s.startsWith(name + '_'); };
  const top = (name) => save.props.find((p) => is(p, name));
  const field = (props, name) => props.find((p) => is(p, name));
  const val = (props, name) => { const p = field(props, name); return p ? p.value : undefined; };
  function setVal(props, name, v) { const p = field(props, name); if (p) { p.value = v; delete p.raw; touch(); } }
  const nm = (x) => S(x);
  // 遊戲的 FName 不分大小寫（例如 CritCHanceOnWeak 等於 CritChanceOnWeak）
  const eq = (a, b) => String(a).toLowerCase() === String(b).toLowerCase();
  const enumIdx = (x) => Number(String(S(x)).split('NewEnumerator')[1]);
  function touch() { dirty = true; status(); }

  const inv = () => top('InventoryItems').value;
  const invHas = (k) => inv().some(([a]) => eq(nm(a), k));
  const invGet = (k) => { const e = inv().find(([a]) => eq(nm(a), k)); return e ? e[1] : 0; };
  function invSet(k, n) {
    const m = inv(); const e = m.find(([a]) => eq(nm(a), k));
    if (n <= 0) { if (e) m.splice(m.indexOf(e), 1); } else if (e) e[1] = n; else m.push([{ s: k }, n]);
    touch();
  }
  const wpArr = () => top('WeaponProgressions').value;
  const wpFind = (k) => wpArr().find((e) => eq(nm(val(e.props, 'DefinitionID')), k));
  const wpLevel = (k) => { const e = wpFind(k); return e ? val(e.props, 'CurrentLevel') : 0; };
  function wpSet(k, lv) {
    const e = wpFind(k);
    if (lv <= 0) { if (e) wpArr().splice(wpArr().indexOf(e), 1); }
    else if (e) setVal(e.props, 'CurrentLevel', lv);
    else wpArr().push({ props: [{ name: { s: F_WP_ID }, type: T('NameProperty'), flags: 0, value: { s: k } }, { name: { s: F_WP_LV }, type: T('IntProperty'), flags: 0, value: lv }] });
    touch();
  }
  const peArr = () => (top('PassiveEffectsProgressions') || {}).value;
  const peFind = (k) => (peArr() || []).find((e) => eq(nm(val(e.props, 'PassiveEffectName')), k));
  function peSet(k, learnt) {
    const a = peArr(); if (!a) return; const e = peFind(k);
    if (learnt === null) { if (e) a.splice(a.indexOf(e), 1); }
    else if (e) { setVal(e.props, 'IsLearnt', learnt); if (learnt && (val(e.props, 'LearntSteps') || 0) < 4) setVal(e.props, 'LearntSteps', 4); }
    else a.push({ props: [{ name: { s: F_PE_N }, type: T('NameProperty'), flags: 0, value: { s: k } }, { name: { s: F_PE_L }, type: T('BoolProperty'), flags: 0, value: !!learnt }, { name: { s: F_PE_S }, type: T('IntProperty'), flags: 0, value: learnt ? 4 : 0 }] });
    touch();
  }
  const chars = () => top('CharactersCollection').value.map(([k, v]) => ({ name: nm(k), props: v.props }));
  // 直接設定欄位值（連同原始位元組一起作廢，寫檔時重新序列化）
  const sv = (props, name, v) => { const p = field(props, name); if (p) { p.value = v; delete p.raw; } };
  // 每個角色的初始武器
  const START_WEAPON = { Gustave: 'Noahram', Lune: 'Lunerim', Maelle: 'Maellum', Sciel: 'Scieleson', Monoco: 'Monocaro', Verso: 'Verleso' };
  // 新增角色：複製現有角色的資料結構，再重設成新角色的初始狀態（等級與 HP 沿用來源角色）
  function addChar(name) {
    const cc = top('CharactersCollection'); const src = cc.value[0][1];
    const v = structuredClone(src); const P = v.props;
    sv(P, 'CharacterHardcodedName', { s: name });
    for (const f of ['CurrentExperience', 'AvailableActionPoints', 'CurrentMP', 'LuminaFromConsumables']) sv(P, f, 0);
    for (const f of ['CharacterActionsOrder', 'PassiveEffectProgressions', 'EquippedPassiveEffects', 'UnlockedSkills', 'EquippedSkills']) sv(P, f, []);
    sv(P, 'IsExcluded', false);
    const ap = field(P, 'AssignedAttributePoints'); if (ap) { for (const e of ap.value) e[1] = 0; delete ap.raw; }
    const w = START_WEAPON[name];
    const eq0 = field(P, 'EquippedItemsPerSlot');
    if (eq0) {
      eq0.value = eq0.value.filter(([k]) => enumIdx(val(k.props, 'ItemType')) === 0 && val(k.props, 'SlotIndex') === 0);
      for (const e of eq0.value) e[1] = { s: w };
      delete eq0.raw;
    }
    const cu = field(P, 'CharacterCustomization');
    if (cu) { sv(cu.value.props, 'CharacterSkin', { s: `Skin${name}_Default` }); sv(cu.value.props, 'CharacterFace', { s: `Face${name}_Default` }); delete cu.raw; }
    cc.value.push([{ s: name }, v]); delete cc.raw;
    if (!invHas(w)) invSet(w, 1);
    if (!wpFind(w)) wpSet(w, 1);
    for (const k of [`Skin${name}_Default`, `Face${name}_Default`]) if (!invHas(k)) invSet(k, 1);
    touch();
  }
  // 移除角色：從角色清單和目前隊伍拿掉
  function removeChar(name) {
    const cc = top('CharactersCollection'); const i = cc.value.findIndex(([k]) => nm(k) === name);
    if (i >= 0) { cc.value.splice(i, 1); delete cc.raw; }
    const party = top('CurrentParty');
    if (party) { party.value = party.value.filter((e) => nm(val(e.props, 'CharacterHardcodedName')) !== name); delete party.raw; }
    touch();
  }
  // 需要按兩次的按鈕（3 秒內）
  const confirmBtn = (label, sure, fn) => {
    const b = h('button', { class: 'pill ghost' }, label); let t = 0;
    b.addEventListener('click', () => {
      if (Date.now() - t < 3000) { fn(); render(); return; }
      t = Date.now(); b.textContent = sure; setTimeout(() => { b.textContent = label; }, 3000);
    });
    return b;
  };
  // 在某個欄位後面插入新的頂層欄位
  function insertTop(after, prop) { const i = save.props.findIndex((p) => is(p, after)); save.props.splice(i >= 0 ? i + 1 : save.props.length, 0, prop); touch(); return prop; }
  // 物品是否被角色裝備中（裝備欄、光輝、光輝組合）
  function equippedBy(k) {
    const who = [];
    for (const c of chars()) {
      const slots = val(c.props, 'EquippedItemsPerSlot') || [];
      const lum = val(c.props, 'EquippedPassiveEffects') || [];
      if (slots.some(([, v]) => eq(nm(v), k)) || lum.some((x) => eq(nm(x), k))) who.push(cn(c.name));
    }
    const sets = top('PassiveEffectsSetCollection');
    if (sets && JSON.stringify(sets.value, (a, b) => (typeof b === 'bigint' ? '' : b)).includes('"' + k + '"')) who.push('光輝組合');
    return who;
  }

  // ---------- 共用元件 ----------
  function status() {
    $('#status').textContent = save ? `${isSample ? '範例 ' : ''}${fileName}${dirty ? '（未下載的修改）' : ''}` : '尚未開啟存檔';
    $('#dl').disabled = !save;
  }
  function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('on'), 2600); }
  const num = (value, onchange, opts = {}) => h('input', { type: 'number', class: 'num', value, min: opts.min ?? 0, max: opts.max, step: opts.step ?? 1, onchange: (e) => { let v = Number(e.target.value); if (opts.max != null) v = Math.min(v, opts.max); onchange(v); render(); } });
  const toggle = (on, onchange, disabled) => h('button', { class: 'tg' + (on ? ' on' : ''), disabled, onclick: () => { onchange(!on); render(); } }, h('span'));
  const section = (title, right, ...kids) => h('div', { class: 'sec' }, h('div', { class: 'sechead' }, h('h2', {}, title), right ? h('span', { class: 'gray' }, right) : null), ...kids);
  const card = (...rows) => h('div', { class: 'card' }, ...rows);
  const row = (main, sub, ...right) => h('div', { class: 'row' }, h('div', { class: 'rm' }, h('div', { class: 'rt' }, main), sub ? h('div', { class: 'rs' }, sub) : null), h('div', { class: 'rr' }, ...right));
  const btn = (label, onclick, cls = '') => h('button', { class: 'pill ' + cls, onclick: () => { onclick(); render(); } }, label);

  // 清單分頁的搜尋與篩選狀態（每個分頁各自記住）
  const ui = {};
  function listTools(key, filters) {
    ui[key] = ui[key] || { q: '', f: filters[0][0] };
    const st = ui[key];
    const q = h('input', { class: 'search', placeholder: '搜尋名稱或代號', value: st.q, oninput: (e) => { st.q = e.target.value; renderList(); } });
    const chips = h('div', { class: 'chips' }, filters.map(([id, label]) => h('button', { class: 'chip' + (st.f === id ? ' on' : ''), onclick: () => { st.f = id; render(); } }, label)));
    return { st, el: h('div', { class: 'tools' }, q, chips) };
  }
  let renderList = () => {};
  const match = (q, ...s) => !q || s.some((x) => String(x || '').toLowerCase().includes(q.toLowerCase()));

  // 物品清單（外觀、武器、符文、唱片、日誌、任務道具、技能解鎖）
  function itemTab(opts) {
    // 拿不到的、付費豪華版的內容不列出（已經擁有的照常顯示）
    const keys = Object.keys(ITEMS).filter((k) => opts.types.includes(ITEMS[k].t) && ((!ITEMS[k].na && !ITEMS[k].paid) || invHas(k)));
    const filters = [['all', '全部'], ['have', '已有'], ['miss', '未有'], ['dlc', 'DLC']];
    if (opts.byChar) for (const c of CHARS) if (keys.some((k) => ITEMS[k].c === c)) filters.push([c, cn(c)]);
    const { st, el } = listTools(opts.key, filters);
    const box = h('div');
    const have = keys.filter(invHas).length;
    const bulk = h('div', { class: 'bulk' },
      btn(`全部加入${opts.maxLv ? `（${opts.maxLv} 級）` : ''}`, () => { for (const k of keys) if (!ITEMS[k].paid) opts.add(k); toast('已加入全部可取得項目'); }),
      opts.maxAll ? btn(`全部升到 ${opts.maxLv} 級`, () => { for (const k of keys) if (invHas(k)) opts.add(k); toast(`已全部升到 ${opts.maxLv} 級`); }, 'ghost') : null);
    renderList = () => {
      box.replaceChildren();
      const list = keys.filter((k) => {
        const it = ITEMS[k];
        if (st.f === 'have' && !invHas(k)) return false;
        if (st.f === 'miss' && invHas(k)) return false;
        if (st.f === 'dlc' && !it.dlc) return false;
        if (CHARS.includes(st.f) && it.c !== st.f) return false;
        return match(st.q, it.n, it.e, k);
      }).sort((a, b) => (ITEMS[a].c || '').localeCompare(ITEMS[b].c || '') || (ITEMS[a].n || a).localeCompare(ITEMS[b].n || b, 'zh-Hant'));
      const c = card();
      for (const k of list.slice(0, 400)) c.append(opts.row(k));
      if (!list.length) c.append(h('div', { class: 'empty' }, '沒有符合的項目'));
      box.append(c);
      if (list.length > 400) box.append(h('div', { class: 'gray pad' }, `只顯示前 400 筆，請用搜尋縮小範圍（共 ${list.length} 筆）`));
    };
    renderList();
    return section(opts.title, `${have} / ${keys.length}`, opts.extra ? opts.extra() : null, bulk, el, box);
  }
  const itemSub = (k) => [cn(ITEMS[k].c), ITEMS[k].dlc ? 'DLC' : '', ITEMS[k].d].filter(Boolean).join(' · ');
  function ownToggle(k, onAdd) {
    const eq = equippedBy(k);
    return toggle(invHas(k), (on) => {
      if (on) onAdd(k); else {
        if (eq.length) return toast(`裝備中（${eq.join('、')}），請先在遊戲裡卸下`);
        invSet(k, 0); wpSet(k, 0); if (ITEMS[k].t === 'P') peSet(k, null);
      }
    });
  }

  // ---------- 分頁 ----------
  const TABS = {
    outfits: ['外觀', () => itemTab({
      key: 'outfits', title: '外觀', types: ['O'], byChar: true,
      add: (k) => invSet(k, 1),
      row: (k) => row(`${ITEMS[k].n || k}（${k.startsWith('Face') ? '髮型' : '服裝'}）`, itemSub(k), ownToggle(k, (x) => invSet(x, 1))),
      extra: () => {
        const c = card();
        for (const ch of chars()) {
          const cc = val(ch.props, 'CharacterCustomization'); if (!cc) continue;
          const pick = (fname, prefix) => {
            const cur = nm(val(cc.props, fname));
            const opts = Object.keys(ITEMS).filter((k) => k.startsWith(prefix + ch.name + '_') && (invHas(k) || k === cur || k.endsWith('_Default')));
            return h('select', { class: 'wear', onchange: (e) => { setVal(cc.props, fname, { s: e.target.value }); render(); } }, opts.map((k) => h('option', { value: k, selected: k === cur }, ITEMS[k].n || k)));
          };
          c.append(row(cn(ch.name), '目前穿著', pick('CharacterSkin', 'Skin'), pick('CharacterFace', 'Face')));
        }
        return c;
      },
    })],
    weapons: ['武器', () => itemTab({

    $('#tabs').replaceChildren(...Object.entries(TABS).map(([id, [label]]) => h('button', { class: 'chip' + (tab === id ? ' on' : ''), onclick: () => { tab = id; render(); window.scrollTo(0, 0); } }, label)));

  async function openFile(f) {
    try {
      const u8 = new Uint8Array(await f.arrayBuffer());
      const s = parse(u8);
      if (!s.props.some((p) => is(p, 'InventoryItems'))) throw new Error('這不是 EXPEDITION 遊戲存檔（沒有背包資料）');
      save = s; fileName = f.name.replace(/^.*?(EXPEDITION_\d+\.sav)$/i, '$1'); origBytes = u8; dirty = false; isSample = false;
      toast(`已開啟 ${fileName}`); render();
    } catch (e) { toast('開啟失敗：' + e.message); }
  }
  // 只存不壓縮的 zip（claude.ai 頁面不允許下載 .sav，改包成 .zip）
  const CRC = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
  function zipOne(name, data) {
    let crc = 0xffffffff; for (const b of data) crc = CRC[(crc ^ b) & 255] ^ (crc >>> 8); crc = (crc ^ 0xffffffff) >>> 0;
    const nb = new TextEncoder().encode(name), d = new Date();
    const time = (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1), date = ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate();
    const hdr = (sig, central) => {
      const b = new DataView(new ArrayBuffer(central ? 46 : 30)); let o = 0;
      const u16 = (v) => { b.setUint16(o, v, true); o += 2; }, u32 = (v) => { b.setUint32(o, v, true); o += 4; };
      u32(sig); if (central) u16(20); u16(20); u16(0x0800); u16(0); u16(time); u16(date); u32(crc); u32(data.length); u32(data.length); u16(nb.length); u16(0);
      if (central) { u16(0); u16(0); u16(0); u32(0); u32(0); }
      return new Uint8Array(b.buffer);
    };
    const local = hdr(0x04034b50, false), central = hdr(0x02014b50, true);
    const cdOff = local.length + nb.length + data.length, cdLen = central.length + nb.length;
    const end = new DataView(new ArrayBuffer(22));
    end.setUint32(0, 0x06054b50, true); end.setUint16(8, 1, true); end.setUint16(10, 1, true); end.setUint32(12, cdLen, true); end.setUint32(16, cdOff, true);
    const w = new GVAS.Writer(); [local, nb, data, central, nb, new Uint8Array(end.buffer)].forEach((x) => w.push(x)); return w.out();
  }
  async function download() {
    const out = serialize(save);
    try { parse(out); } catch (e) { return toast('檢查失敗，沒有下載：' + e.message); }
    const name = fileName || 'EXPEDITION_0.sav';
    const dl = window.claude && window.claude.use ? await window.claude.use('downloads').catch(() => null) : null;
    if (dl) {
      try { await dl.save({ filename: name.replace(/\.sav$/i, '') + '.zip', data: new Blob([zipOne(name, out)]) }); }
      catch (e) { return toast(e.code === 'declined' ? '已取消下載' : '下載失敗：' + (e.message || e.code)); }
      dirty = false; status(); return toast(`已下載 ${name.replace(/\.sav$/i, '')}.zip，解壓縮後就是 ${name}`);
    }
    const a = h('a', { href: URL.createObjectURL(new Blob([out])), download: name });
    document.body.append(a); a.click(); a.remove();
    dirty = false; status(); toast('已下載，換檔前請先備份原本的存檔');
  }
  window.E33_ZIP = zipOne;

  window.addEventListener('DOMContentLoaded', () => {
    $('#file').addEventListener('change', (e) => e.target.files[0] && openFile(e.target.files[0]));
    $('#open').addEventListener('click', () => $('#file').click());
    $('#dl').addEventListener('click', download);
    // 頁面裡不能用 confirm()，改成三秒內再按一次才還原
    let armed = 0;
    $('#reset').addEventListener('click', () => {
      if (!origBytes) return;
      if (Date.now() - armed > 3000) { armed = Date.now(); return toast('再按一次，放棄所有修改'); }
      armed = 0; save = parse(origBytes); dirty = false; render(); toast('已還原到剛開啟時的狀態');
    });
    document.addEventListener('dragover', (e) => e.preventDefault());
    document.addEventListener('drop', (e) => { e.preventDefault(); if (e.dataTransfer.files[0]) openFile(e.dataTransfer.files[0]); });
    window.addEventListener('beforeunload', (e) => { if (dirty) e.preventDefault(); });
    // 還沒開檔時先載入範例存檔，頁面一打開就能操作
    try {
      if (window.E33_SAMPLE && !window.E33_SAMPLE.startsWith('/*')) {
        const u8 = Uint8Array.from(atob(window.E33_SAMPLE), (c) => c.charCodeAt(0));
        save = parse(u8); origBytes = u8; fileName = 'EXPEDITION_1.sav'; isSample = true;
      }
    } catch (e) { save = null; isSample = false; }
    render();
  });
  window.E33_APP = { get save() { return save; }, openBytes: (u8, name) => { save = parse(u8); fileName = name; origBytes = u8; dirty = false; render(); }, serialize: () => serialize(save), TABS, render, setTab: (t) => { tab = t; render(); } };
})();
</script>
